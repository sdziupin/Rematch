name: iOS → TestFlight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight (off = archive and export only)
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor

  testflight:
    needs: check
    # PRs only get checks; secrets aren't available to forks anyway.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 5K9D77KS36
      APP_ID: com.sdziupin.rematch
      APP_PROFILE: REMATCH AppStore
      WIDGETS_ID: com.sdziupin.rematch.widgets
      WIDGETS_PROFILE: REMATCH Widgets AppStore
      UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install signing certificate and API key
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -a -p "$KC" > "$RUNNER_TEMP/dist.pem"
          mkdir -p "$RUNNER_TEMP/keys"; echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          security find-identity -v -p codesigning "$KC"

      # App IDs, capabilities and App Store profiles for both targets, through the API key:
      # reused while valid, regenerated when capabilities, the certificate or expiry change.
      - name: Fetch provisioning profiles
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" CERT_PEM="$RUNNER_TEMP/dist.pem" \
            node scripts/ios-profiles.mjs

      - name: Generate native project
        run: |
          npx expo prebuild --platform ios --clean
          # Two signed targets, each with its own App Store profile: the app (HealthKit,
          # App Group, push) and its widget extension (App Group). Each build configuration
          # that sets a team gets manual signing with the profile for its own bundle id
          # (CocoaPods sorts the keys, so the team can come before the bundle id). Pods stay unsigned.
          perl -0pi -e '
            s/^\s*"?CODE_SIGN_IDENTITY(\[sdk=iphoneos\*\])?"? = "iPhone Developer";\n//mg;
            s{buildSettings = \{.*?\n\t*\};}{
              my $b = $&;
              my ($id) = $b =~ /PRODUCT_BUNDLE_IDENTIFIER = "?([\w.]+)"?;/;
              my $p = ($id // "") eq $ENV{WIDGETS_ID} ? $ENV{WIDGETS_PROFILE} : $ENV{APP_PROFILE};
              $b =~ s/^(\s*)DEVELOPMENT_TEAM = \w+;\n/$&$1CODE_SIGN_STYLE = Manual;\n$1"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n$1PROVISIONING_PROFILE_SPECIFIER = "$p";\n/m;
              $b }gse' ios/REMATCH.xcodeproj/project.pbxproj
          grep -n 'CODE_SIGN\|DEVELOPMENT_TEAM\|PRODUCT_BUNDLE_IDENTIFIER' ios/REMATCH.xcodeproj/project.pbxproj
          # expo-widgets writes a development push entitlement; App Store profiles carry production.
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/REMATCH/REMATCH.entitlements
          # Monotonic build number, the same for the app and its extension; re-runs get a higher one too.
          for plist in ios/REMATCH/Info.plist ios/ExpoWidgetsTarget/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}.${{ github.run_attempt }}" "$plist"
          done

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/REMATCH.xcworkspace -scheme REMATCH -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/REMATCH.xcarchive" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(error|warning: .*sign)|\*\* ARCHIVE' || true
          test -d "$RUNNER_TEMP/REMATCH.xcarchive" || { tail -200 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DESTINATION=$([ "$UPLOAD" = "true" ] && echo upload || echo export)
          /usr/libexec/PlistBuddy -c "Clear dict" \
            -c "Add :method string app-store-connect" -c "Add :destination string $DESTINATION" \
            -c "Add :teamID string $TEAM_ID" -c "Add :signingStyle string manual" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$APP_ID string $APP_PROFILE" \
            -c "Add :provisioningProfiles:$WIDGETS_ID string $WIDGETS_PROFILE" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/REMATCH.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: ${{ runner.temp }}/*.log

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
