name: iOS → TestFlight

on:
  push:
    branches: [main, ci/ios-testflight]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor

  testflight:
    needs: check
    # PRs only get checks; secrets aren't available to forks anyway.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 5K9D77KS36
      PROFILE_NAME: REMATCH AppStore
      BUNDLE_ID: com.sdziupin.rematch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; echo "$PROFILE_BASE64" | base64 -d > "$d/rematch.mobileprovision"
          done
          mkdir -p "$RUNNER_TEMP/keys"; echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          security find-identity -v -p codesigning "$KC"

      - name: Generate native project
        run: |
          npx expo prebuild --platform ios --clean
          # One app target in this project; Pods live in their own project and stay unsigned.
          perl -pi -e '
            s/^(\s*)DEVELOPMENT_TEAM = \w+;/$&\n$1CODE_SIGN_STYLE = Manual;\n$1PROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/;
            s/"iPhone Developer"/"Apple Distribution"/' ios/REMATCH.xcodeproj/project.pbxproj
          # Monotonic build number; re-runs get a higher one too.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}.${{ github.run_attempt }}" ios/REMATCH/Info.plist

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/REMATCH.xcworkspace -scheme REMATCH -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/REMATCH.xcarchive" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(error|warning: .*sign)|\*\* ARCHIVE' || true
          test -d "$RUNNER_TEMP/REMATCH.xcarchive" || { tail -200 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Clear dict" \
            -c "Add :method string app-store-connect" -c "Add :destination string upload" \
            -c "Add :teamID string $TEAM_ID" -c "Add :signingStyle string manual" \
            -c "Add :provisioningProfiles dict" -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/REMATCH.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: ${{ runner.temp }}/*.log

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
